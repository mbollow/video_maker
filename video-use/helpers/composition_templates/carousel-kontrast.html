<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!--
  Karussell INNEN-Slide, Layout „kontrast" (1080x1350 / 4:5).
  Zwei beschriftete Gegensatz-Zeilen (z.B. Vorgesetzter vs. Führungskraft) plus
  eine Folgerung darunter. Kopf (Badge, Eyebrow, Nummer, Icon, Titel) wie carousel-inner.html.
  Gefüllt von karussell_build.py (layout: kontrast), gerendert via render_image_post.cjs.

  Platzhalter:
    {{EYEBROW}} {{LOGO_SRC}} {{NUMBER}} {{ICON_SVG}} {{TITLE_HTML}} {{FONT_SCALE}}
    {{ROWS_HTML}}  – beschriftete Zeilen in Outline-Reihenfolge, je
                     <div class="row kontra|pro|neutral"><div class="label">…</div><div class="line">…</div></div>
                     kontra = schwach (Reflex/Muster), pro = Teal-Label + Marker (Dein Satz/Hebel),
                     neutral = Navy-Label, volle Deckung (Sicherung/Begründung)
    {{BODY_BLOCK}} – Folgerung als <div class="body">…</div> oder leer
-->
<style>
  @font-face { font-family: 'Korbin'; src: url('{{FONTS_DIR}}/Korbin-Medium.otf') format('opentype'); font-weight: 100 900; font-style: normal; font-display: block; }
  @font-face { font-family: 'Montserrat'; src: url('{{FONTS_DIR}}/Montserrat-var.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: block; }
  @font-face { font-family: 'DM Sans'; src: url('{{FONTS_DIR}}/DMSans-var.ttf') format('truetype'); font-weight: 100 1000; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  .stage {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: 'Korbin', 'Montserrat', system-ui, sans-serif; background: #f8f6f2;
    font-synthesis: none;
    --fs-scale: {{FONT_SCALE}};
    --pad-x: 158px;
  }
  .badge {
    position: absolute; top: 0; left: 120px; width: 140px; height: 140px;
    background: #4ebbc2; display: flex; align-items: center; justify-content: center;
  }
  .badge img { width: 118px; height: auto; filter: brightness(0) invert(1); }
  .eyebrow {
    position: absolute; top: 60px; left: 288px; height: 32px;
    color: #4ebbc2; font-weight: 600; font-size: 27px; letter-spacing: 0.01em;
  }
  .num {
    position: absolute; top: 210px; left: 96px;
    font-weight: 300; font-size: 236px; line-height: 1; color: #d3ece9; letter-spacing: -0.02em;
  }
  .icon { position: absolute; top: 150px; right: 74px; width: 186px; height: 186px; color: #4ebbc2; }
  .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
  .content { position: absolute; top: 352px; left: var(--pad-x); right: var(--pad-x); bottom: 92px; }
  .title {
    color: #281d67; font-weight: 500; font-size: calc(96px * var(--fs-scale));
    line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 64px;
  }
  /* Gegensatz-Zeilen: kleines Label (Pill) über dem Satz */
  .row { margin-bottom: 52px; }
  .label {
    display: inline-block; font-family: 'Montserrat', 'Korbin', sans-serif;
    font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 8px 18px 7px; border-radius: 4px; margin-bottom: 18px;
  }
  .row.kontra .label { color: #281d67; border: 2px solid #281d67; opacity: 0.55; }
  .row.pro .label { color: #281d67; background: #4ebbc2; }
  .row.neutral .label { color: #f8f6f2; background: #281d67; }
  .line {
    font-family: 'Korbin', 'DM Sans', system-ui, sans-serif;
    color: #281d67; font-weight: 400; font-size: calc(48px * var(--fs-scale));
    line-height: 1.3; letter-spacing: 0.01em; text-wrap: pretty;
  }
  .row.kontra .line { opacity: 0.62; }
  /* Folgerung: Teal-Linie davor, Text etwas kleiner */
  .body {
    margin-top: 16px; padding-top: 44px; border-top: 3px solid #4ebbc2;
    font-family: 'Korbin', 'DM Sans', system-ui, sans-serif;
    color: #281d67; font-weight: 400; font-size: calc(38px * var(--fs-scale));
    line-height: 1.5; letter-spacing: 0.01em; text-wrap: pretty;
  }
  .body .para { margin: 0 0 26px; }
  .body .para:last-child { margin-bottom: 0; }
  .hl { box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hl-box, .hl-boxdark { background: #4ebbc2; color: #281d67; padding: 0 10px 3px; border-radius: 6px; }
  .hl-farbe { color: #4ebbc2; font-weight: 700; }
  .hl-underline { background: linear-gradient(#4ebbc2, #4ebbc2) left bottom / 100% 0.14em no-repeat; }
</style>
</head>
<body>
  <div class="stage">
    <div class="badge"><img src="{{LOGO_SRC}}" alt="Palstek" /></div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <div class="num">{{NUMBER}}</div>
    <div class="icon">{{ICON_SVG}}</div>
    <div class="content">
      <div class="title">{{TITLE_HTML}}</div>
      {{ROWS_HTML}}
      {{BODY_BLOCK}}
    </div>
  </div>
</body>
</html>
