<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!--
  Karussell ENDE-Slide (1080x1350 / 4:5).
  Freigestellte Person auf einer Teal-Fläche mit welligem oberem Rand (statt
  hartem Foto-Rechteck). Gefüllt von karussell_build.py, gerendert via render_image_post.cjs.

  Platzhalter:
    {{EYEBROW}}         – Karussell-Thema (Eyebrow)
    {{LOGO_SRC}}        – Logo (Teal-Badge, weiß invertiert)
    {{STATEMENT_HTML}}  – Schluss-Statement (.lx-Zeilen + <span class="hl ...">)
    {{PHOTO_SRC}}       – FREIGESTELLTES Foto (transparentes PNG, unten bündig)
    {{CTA_TEXT}}        – handschriftlicher CTA-Text
    {{FONT_SCALE}}      – Skalierung des Statements
-->
<style>
  @font-face { font-family: 'Montserrat'; src: url('{{FONTS_DIR}}/Montserrat-var.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: block; }
  @font-face { font-family: 'Caveat'; src: url('{{FONTS_DIR}}/Caveat-var.ttf') format('truetype'); font-weight: 400 700; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  .stage {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: 'Montserrat', system-ui, sans-serif; background: #f8f6f2;
    --fs-scale: {{FONT_SCALE}};
  }
  /* Teal-Fläche mit welligem Rand, füllt das untere Drittel und wölbt sich ÜBER
     den Kopf der Person (grenzt ihren Bereich vom Rest der Folie ab). */
  .wave {
    position: absolute; left: 0; bottom: 0; width: 1080px; height: 760px;
  }
  /* Freigestellte Person, unten bündig, links-mittig — Kopf liegt INNERHALB der Welle */
  .cutout {
    position: absolute; left: -14px; bottom: 0; height: 600px; width: auto;
    transform: {{CUTOUT_TRANSFORM}};
  }
  .badge {
    position: absolute; top: 0; left: 120px; width: 140px; height: 140px;
    background: #4ebbc2; border-radius: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .badge img { width: 118px; height: auto; filter: brightness(0) invert(1); }
  .eyebrow {
    position: absolute; top: 60px; left: 288px; height: 32px;
    color: #4ebbc2; font-weight: 600; font-size: 27px; letter-spacing: 0.01em;
  }
  /* Schluss-Statement, zentriert im oberen Drittel */
  .statement {
    position: absolute; top: 206px; left: 84px; right: 84px; text-align: center;
    color: #281d67; line-height: 1.16;
  }
  .statement .lx { font-weight: 800; font-size: calc(52px * var(--fs-scale)); letter-spacing: -0.01em; margin: 0 0 8px; }
  .hl { box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hl-box     { background: #4ebbc2; color: #fff; padding: 0 12px 4px; border-radius: 7px; }
  .hl-boxdark { background: #281d67; color: #fff; padding: 0 12px 4px; border-radius: 7px; }
  .hl-farbe   { color: #4ebbc2; }
  .hl-underline { background: linear-gradient(#4ebbc2, #4ebbc2) left bottom / 100% 0.15em no-repeat; }
  /* Handschriftlicher CTA + Pfeil, rechts über der Teal-Fläche */
  .cta {
    position: absolute; right: 84px; bottom: 322px; width: 340px; text-align: left;
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 46px;
    color: #281d67; line-height: 1.15;
  }
  .cta-arrow {
    position: absolute; right: 104px; bottom: 236px; width: 210px; height: 58px;
    color: #4ebbc2;
  }
  .cta-arrow svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="stage">
    <svg class="wave" viewBox="0 0 1080 760" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,75 C 70,30 150,8 240,10 C 320,12 420,22 500,48 C 600,82 720,170 830,192 C 940,214 1030,196 1080,188 L1080,760 L0,760 Z" fill="#4ebbc2" opacity="0.12"/>
      <path d="M0,130 C 70,80 150,55 240,58 C 320,60 420,70 500,95 C 600,128 720,215 830,235 C 940,255 1030,235 1080,225 L1080,760 L0,760 Z" fill="#4ebbc2" opacity="0.20"/>
    </svg>
    <img class="cutout" src="{{PHOTO_SRC}}" alt="" />
    <div class="badge"><img src="{{LOGO_SRC}}" alt="Palstek" /></div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <div class="statement">
      {{STATEMENT_HTML}}
    </div>
    <div class="cta">{{CTA_TEXT}}</div>
    <div class="cta-arrow">
      <svg viewBox="0 0 210 58" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 34 C 70 20, 140 22, 198 30" />
        <path d="M178 14 L202 30 L178 46" />
      </svg>
    </div>
  </div>
</body>
</html>
