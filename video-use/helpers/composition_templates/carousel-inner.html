<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!--
  Karussell INNEN-Slide (1080x1350 / 4:5).
  Gefüllt von karussell_build.py, gerendert via render_image_post.cjs.

  Platzhalter:
    {{EYEBROW}}    – Karussell-Thema (Eyebrow, identisch über alle Slides)
    {{LOGO_SRC}}   – Logo (wird im Teal-Badge weiß invertiert)
    {{NUMBER}}     – Slide-Nummer, z.B. "01"
    {{ICON_SVG}}   – Inline-SVG (Lucide, stroke=currentColor)
    {{TITLE_HTML}} – Slide-Titel (darf <br> enthalten)
    {{BODY_HTML}}  – Fließtext-Absätze (<p class="para"> … </p>, optional <span class="hl ...">)
    {{FONT_SCALE}} – Skalierung von Titel + Body
-->
<style>
  @font-face { font-family: 'Montserrat'; src: url('{{FONTS_DIR}}/Montserrat-var.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: block; }
  @font-face { font-family: 'DM Sans'; src: url('{{FONTS_DIR}}/DMSans-var.ttf') format('truetype'); font-weight: 100 1000; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  .stage {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: 'Montserrat', system-ui, sans-serif; background: #f8f6f2;
    --fs-scale: {{FONT_SCALE}};
    /* gemeinsamer Seiten-Abstand (links = rechts) für Nummer/Titel/Text */
    --pad-x: 190px;
  }
  /* Teal-Badge: eckig, oben randbündig, ~2cm vom linken Rand, groß */
  .badge {
    position: absolute; top: 0; left: 120px; width: 140px; height: 140px;
    background: #4ebbc2; border-radius: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .badge img { width: 118px; height: auto; filter: brightness(0) invert(1); }
  .eyebrow {
    position: absolute; top: 60px; left: 288px; height: 32px;
    color: #4ebbc2; font-weight: 600; font-size: 27px; letter-spacing: 0.01em;
  }
  /* Große, blasse, DÜNNE Slide-Nummer — deutlicher Abstand zur Badge-Box,
     wird von der Überschrift leicht überdeckt */
  .num {
    position: absolute; top: 210px; left: 96px;
    font-weight: 300; font-size: 236px; line-height: 1; color: #d3ece9;
    letter-spacing: -0.02em;
  }
  /* Line-Icon oben rechts (helleres Teal) */
  .icon {
    position: absolute; top: 158px; right: 78px; width: 146px; height: 146px;
    color: #6edbd7;
  }
  .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
  /* Titel + Text als fließender Block (Abstand stimmt bei jeder Titellänge) */
  .content {
    position: absolute; top: 352px; left: var(--pad-x); right: var(--pad-x); bottom: 92px;
  }
  /* Titel — NICHT fett, überlappt die Nummer leicht (paint order: nach .num) */
  .title {
    color: #281d67; font-weight: 500; font-size: calc(96px * var(--fs-scale));
    line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 50px;
  }
  /* Fließtext-Absätze — DM Sans, Dunkelblau, groß (wenige Wörter pro Zeile) */
  .body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #281d67; font-weight: 400; font-size: calc(38px * var(--fs-scale));
    line-height: 1.62; letter-spacing: 0.01em;
  }
  .body .para { margin: 0 0 34px; }
  .body .para:last-child { margin-bottom: 0; }
  /* Highlight-Formen */
  .hl { box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hl-box     { background: #4ebbc2; color: #fff; padding: 0 10px 3px; border-radius: 6px; }
  .hl-boxdark { background: #281d67; color: #fff; padding: 0 10px 3px; border-radius: 6px; }
  .hl-farbe   { color: #4ebbc2; font-weight: 700; }
  .hl-underline { background: linear-gradient(#4ebbc2, #4ebbc2) left bottom / 100% 0.14em no-repeat; }
  /* Footer */
  .footer {
    position: absolute; bottom: 42px; left: 0; right: 0; text-align: center;
    color: #9db3b0; font-weight: 600; font-size: 22px; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="badge"><img src="{{LOGO_SRC}}" alt="Palstek" /></div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <div class="num">{{NUMBER}}</div>
    <div class="icon">{{ICON_SVG}}</div>
    <div class="content">
      <div class="title">{{TITLE_HTML}}</div>
      <div class="body">
        {{BODY_HTML}}
      </div>
    </div>
    <div class="footer">Palstek GmbH</div>
  </div>
</body>
</html>
